name: API

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: 8.0.x
  SOLUTION_FILE: backend/PurchaseOrderApp.slnx
  API_IMAGE: purchase-order-api
  IMAGE_TAG: ${{ github.sha }}
  ACR_NAME: ${{ secrets.ACR_NAME }}
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  API_CONTAINER_APP: ${{ secrets.API_CONTAINER_APP }}
  API_RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}

jobs:
  build-and-deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore $env:SOLUTION_FILE

      - name: Build solution
        run: dotnet build $env:SOLUTION_FILE --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test $env:SOLUTION_FILE --configuration Release --no-build

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Build and push API image
        run: |
          az acr login --name $env:ACR_NAME

          $image = "$($env:ACR_NAME).azurecr.io/$($env:API_IMAGE):$($env:IMAGE_TAG)"

          docker build `
            -t $image `
            -f "$env:GITHUB_WORKSPACE/docker/api.dockerfile" `
            $env:GITHUB_WORKSPACE

          docker push $image

      - name: Deploy API
        run: |
          $image = "$($env:ACR_NAME).azurecr.io/$($env:API_IMAGE):$($env:IMAGE_TAG)"

          az containerapp update `
            --name $env:API_CONTAINER_APP `
            --resource-group $env:API_RESOURCE_GROUP `
            --image $image
